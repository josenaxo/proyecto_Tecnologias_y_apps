        <div class="flex items-center gap-3 px-5 pt-2 pb-4">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F0F6FF" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

        </div>
        <div class="px-8 mb-5 grid grid-cols-3 gap-3">
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="1" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">1</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="2" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">2</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="3" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">3</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="4" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">4</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="5" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">5</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="6" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">6</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="7" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">7</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="8" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">8</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="9" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">9</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="." style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">.</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="0" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF">0</button>
          <button class="key flex items-center justify-center rounded-2xl transition-all active:scale-90" data-k="⌫" style="height:52px;background:rgba(255,255,255,0.05);font-family:'JetBrains Mono';font-weight:600;font-size:18px;color:#F0F6FF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F0F6FF" stroke-width="2" stroke-linecap="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
        </div>
        <div class="px-5 mb-5">
          <p style="font-size:11px;font-weight:600;color:#6B7A99;letter-spacing:0.06em;margin-bottom:12px">CATEGORÍA</p>
          <div id="cats" class="grid grid-cols-4 gap-2"></div>
        </div>
        <div class="px-5 mb-6">
          <input placeholder="Descripción (opcional)" class="w-full outline-none bg-transparent rounded-2xl px-4" style="height:44px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.04);font-size:14px;color:#F0F6FF" />
        </div>
        <div class="px-5 pb-10">
          <button id="save" class="w-full flex items-center justify-center rounded-2xl transition-all active:scale-[0.97]" style="height:56px;font-family:'Outfit';font-weight:700;font-size:16px;color:white">Guardar movimiento</button>
        </div>
      </div>
      </div>
    <div class="bottom-nav-wrap">
      <div class="flex items-center justify-around px-1" style="height:80px;background:linear-gradient(to top, #060B16 75%, rgba(6,11,22,0.9) 100%);border-top:1px solid rgba(255,255,255,0.06)">
        <a href="home.html" class="flex flex-col items-center gap-1 py-2 px-4 transition-all active:scale-90">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size:10px;font-weight:500;color:#6B7A99">Inicio</span>
    </a>
        <a href="accounts.html" class="flex flex-col items-center gap-1 py-2 px-4 transition-all active:scale-90">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3l-8 4"/><circle cx="17" cy="14" r="1.5" fill="#6B7A99" stroke="none"/></svg>
      <span style="font-size:10px;font-weight:500;color:#6B7A99">Cuentas</span>
    </a>
        <a href="add.html" class="flex items-center justify-center rounded-full transition-transform active:scale-90" style="width:56px;height:56px;background:linear-gradient(135deg, #00D4AA 0%, #00A882 100%);box-shadow:0 4px 20px rgba(0,212,170,0.45)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
        <a href="goals.html" class="flex flex-col items-center gap-1 py-2 px-4 transition-all active:scale-90">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      <span style="font-size:10px;font-weight:500;color:#6B7A99">Metas</span>
    </a>
        <a href="profile.html" class="flex flex-col items-center gap-1 py-2 px-4 transition-all active:scale-90">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size:10px;font-weight:500;color:#6B7A99">Perfil</span>
    </a>
      </div>
    </div>
    </div>
  </div>
  <script>
    const expCats = [
      { e: '🛒', l: 'Alimentación' }, { e: '🚗', l: 'Transporte' }, { e: '🎬', l: 'Ocio' },
      { e: '💊', l: 'Salud' }, { e: '🍽️', l: 'Restaurantes' }, { e: '🏠', l: 'Hogar' }, { e: '👕', l: 'Ropa' }, { e: '📱', l: 'Tech' },
    ];
    const incCats = [
      { e: '💼', l: 'Salario' }, { e: '🎨', l: 'Freelance' }, { e: '📈', l: 'Inversión' },
      { e: '🎁', l: 'Regalo' }, { e: '🏦', l: 'Intereses' }, { e: '💸', l: 'Otro' }, { e: '🏘️', l: 'Arriendo' }, { e: '📦', l: 'Venta' },
    ];
    let type = 'expense', amount = '', category = '';
    const $ = (id) => document.getElementById(id);
    function accent() { return type === 'expense' ? '#FF5A7E' : '#00D4AA'; }
    function accentBg() { return type === 'expense' ? 'rgba(255,90,126,0.12)' : 'rgba(0,212,170,0.12)'; }
    function renderType() {
      document.querySelectorAll('.type-btn').forEach((b) => {
        const on = b.dataset.t === type;
        b.style.background = on ? (b.dataset.t === 'expense' ? '#FF5A7E' : '#00D4AA') : 'transparent';
        b.style.color = on ? 'white' : '#6B7A99';
      });
      $('save').style.background = type === 'expense' ? 'linear-gradient(135deg, #FF5A7E, #D93D65)' : 'linear-gradient(135deg, #00D4AA, #00A882)';
      $('save').style.boxShadow = type === 'expense' ? '0 4px 24px rgba(255,90,126,0.3)' : '0 4px 24px rgba(0,212,170,0.3)';
    }
    function renderCats() {
      const cats = type === 'expense' ? expCats : incCats;
      $('cats').innerHTML = cats.map((c) => {
        const on = category === c.l;
        return '<button class="cat flex flex-col items-center gap-1 py-2.5 rounded-xl transition-all" data-l="' + c.l + '" style="background:' +
          (on ? accentBg() : 'rgba(255,255,255,0.04)') + ';border:1px solid ' + (on ? accent() : 'rgba(255,255,255,0.06)') + '">' +
          '<span style="font-size:20px">' + c.e + '</span>' +
          '<span style="font-size:9px;color:' + (on ? '#F0F6FF' : '#6B7A99') + ';text-align:center;line-height:1.2">' + c.l + '</span></button>';
      }).join('');
      $('cats').querySelectorAll('.cat').forEach((b) =>
        b.addEventListener('click', () => { category = b.dataset.l; renderCats(); }));
    }
    function renderAmount() {
      $('amount').textContent = amount ? '$' + parseInt(amount).toLocaleString('es-CL') : '$0';
    }
    document.querySelectorAll('.key').forEach((k) => k.addEventListener('click', () => {
      const d = k.dataset.k;
      if (d === '⌫') { amount = amount.slice(0, -1); }
      else if (amount.length < 9) { amount += d; }
      renderAmount();
    }));
    document.querySelectorAll('.type-btn').forEach((b) => b.addEventListener('click', () => {
      type = b.dataset.t; category = ''; renderType(); renderCats();
    }));
    renderType(); renderCats(); renderAmount();
  </script>
</body>
</html>
